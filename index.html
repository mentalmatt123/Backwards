<!DOCTYPE html>
<html lang="en"></html>

<head>
    <meta charset="UTF-8">
    <title>Word Reverser</title>
</head>
<body>
    <style>
        .content {
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>

    <div class="content">
        <h1>Word Reverser</h1>

        <input id="Word" placeholder="Word goes here" value="Lorem Ipsum">
        <button onclick="Reverse()">Press to reverse</button>
    </div>

    <script>
        function Reverse() {
            document.getElementById("Word").value = document.getElementById("Word").value.split('').reverse().join('')
        }
    </script>
</body>
